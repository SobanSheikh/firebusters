# Temporary hackathon deployment. Koyeb remains the post-demo target.
services:
  - type: web
    name: firebusters-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health/live
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: firebusters-assets
      - key: AI_PROVIDER
        value: groq
      - key: AI_MODEL
        value: openai/gpt-oss-20b
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: AI_TIMEOUT_SECONDS
        value: 35
      - key: ASSISTANT_TIMEOUT_SECONDS
        value: 65
      - key: ASSISTANT_CLIENT_REQUESTS_PER_MINUTE
        value: 6
      - key: ASSISTANT_GLOBAL_REQUESTS_PER_MINUTE
        value: 30
      - key: ASSISTANT_MAX_CONCURRENCY
        value: 3
      - key: AI_MAX_OUTPUT_TOKENS
        value: 2048
      - key: GROQ_API_KEY
        sync: false
