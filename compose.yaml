services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-firebusters}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-firebusters_dev}
      POSTGRES_DB: ${POSTGRES_DB:-firebusters}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-firebusters} -d ${POSTGRES_DB:-firebusters}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: firebusters-api:dev
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-firebusters}:${POSTGRES_PASSWORD:-firebusters_dev}@db:5432/${POSTGRES_DB:-firebusters}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      AI_PROVIDER: ${AI_PROVIDER:-groq}
      AI_MODEL: ${AI_MODEL:-openai/gpt-oss-20b}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.groq.com/openai/v1}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-2048}
      SUPABASE_URL: ${SUPABASE_URL:-}
      EMBEDDING_FUNCTION_NAME: ${EMBEDDING_FUNCTION_NAME:-bright-action}
      EMBEDDING_SECRET: ${EMBEDDING_SECRET:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./data:/app/data
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
