[project]
name = "firebusters-api"
version = "0.1.0"
description = "Evidence-first NASA combustion investigation API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy[asyncio]==2.1.6",
    "asyncpg==0.32.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.2",
    "python-multipart==0.0.32",
    "httpx==0.28.1",
    "alembic==1.20.1",
    "pgvector==0.5.1",
    "openai==3.41.0",
    "anthropic==1.13.0",
    "langgraph==1.2.18",
    "langchain-core==1.7.1",
    "langchain-openai==1.7.3",
    "langchain-anthropic==1.7.6",
    "pypdf==6.21.4",
    "markitdown[docx,pptx,xlsx,pdf]==0.1.9",
    "polars>=1.37,<2",
    "pyarrow>=21,<23",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "ruff==0.15.15",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
